name: Terraform Destroy

# Manual only — tears down every resource managed by infrastructure/.
# Requires typing "destroy" to confirm, so it can never run by accident.
# (Does NOT touch the bootstrap state bucket.)
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "destroy" to confirm tearing everything down'
        required: true
        default: ""

permissions:
  contents: read

env:
  TF_VERSION: "1.10.5"
  AWS_REGION: eu-west-2

defaults:
  run:
    working-directory: infrastructure

jobs:
  destroy:
    name: destroy
    runs-on: ubuntu-latest
    steps:
      - name: Check confirmation
        if: ${{ inputs.confirm != 'destroy' }}
        run: |
          echo "::error::You must type 'destroy' to confirm. Got '${{ inputs.confirm }}'."
          exit 1

      - uses: actions/checkout@v5

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Init
        run: terraform init

      - name: Destroy
        run: terraform destroy -auto-approve -input=false
